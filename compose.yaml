services:
  api:
  build: .
  container_name: url_shortener_api
  ports:
    - "8000:8000"
  environment:
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    redis:
      condition: service_healthy
  
  redis:
    image: redis:7
    container_name: url_shortener_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:






