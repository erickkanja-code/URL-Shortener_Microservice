[project]
name = "url-shortener-microservice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pyflakes (F) and pycodestyle's error checks (E4, E7, E9): real mistakes such as
# unused imports, undefined names and invalid syntax, not style preferences.
select = ["E4", "E7", "E9", "F"]
